[workspace]
# legacy/* — прежний стек (softbuffer-оболочка, TAD-редакторы, skia-renderer).
# Исключён из сборки: продукт — canvas-WM (compositor) + фосфорная оболочка (phosphor).
# Подробности и известная потеря: legacy/README.md
resolver = "2"
members = [
    "crates/tad-core",
    "crates/canvas-engine",
    "crates/de-common",
    "crates/compositor",
    "crates/phosphor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ZUI-TAD Shell Project"]

[workspace.dependencies]
# Сериализация
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"

# Идентификаторы
uuid = { version = "1.10", features = ["v4", "serde"] }

# Математика
cgmath = { version = "0.18", features = ["serde"] }

# Логирование
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"

# Embedded DB
sled = "0.34"

# CPU 2D rendering (работает headless + в рантайме)
tiny-skia = "0.11"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Утилиты
ahash = "0.8"
parking_lot = "0.12"
once_cell = "1.20"

# Окно и ввод (CPU-рендеринг в окно через softbuffer)
winit = { version = "0.30", features = ["wayland", "x11"] }
softbuffer = "0.4"
rdev = "0.5"

# Wayland compositor (настоящая DE, smithay 0.5)
# Для сборки: sudo apt install libudev-dev libseat-dev libdrm-dev libgbm-dev libinput-dev pkg-config
smithay = { version = "0.5", default-features = false, features = [
    "backend_winit", "backend_egl",
    "backend_drm", "backend_udev", "backend_gbm",
    "backend_libinput", "backend_session",
    "renderer_gl", "wayland_frontend",
    "desktop", "input", "xwayland", "use_system_lib"
] }
wayland-server = "0.31"
xdg = "2.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
toml = "0.8"

[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
